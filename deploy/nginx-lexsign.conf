# LexSign reverse proxy. setup-server.sh replaces __DOMAIN__ and certbot adds the HTTPS block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Cause-list Excel uploads
    client_max_body_size 20M;

    # Keep kiosk screens out of browser caches so they always see the current index.html
    location = / { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "no-store"; include /etc/nginx/proxy_params; }
    location /display/ { proxy_pass http://127.0.0.1:8000; add_header Cache-Control "no-store"; include /etc/nginx/proxy_params; }

    # OPTIONAL hardening until the API has token authentication:
    # only let the court's office network reach the admin and clerk endpoints.
    # Replace the IP with the court's public IP (search "what is my ip" from the court) and uncomment.
    #
    # location ~ ^/api/(admin|cause-list/[^/]+/(upload|clear|matter|add-single)|bench/[^/]+/(state|ticker|action)) {
    #     allow 203.0.113.10;
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     include /etc/nginx/proxy_params;
    # }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }
}
